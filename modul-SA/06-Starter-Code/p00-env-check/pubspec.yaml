name: p00_env_check
description: "Remedial Task Tracker: P00 Environment Checker. Smoke test satu screen bukti semua library PPB Remidi (provider, sqflite, http, image_picker, geolocator, path/path_provider) ter-import dan jalan di mesin mahasiswa. Bukan aplikasi nyata."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  http: ^1.2.2
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  sqflite_common_ffi: ^2.3.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
