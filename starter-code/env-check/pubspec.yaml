name: env_check
description: >-
  Verifikasi lingkungan pengembangan untuk mata kuliah Pemrograman Mobile
  (Flutter). Satu proyek kecil yang menyentuh setiap paket dan setiap jenis
  pengujian yang dipakai buku, dari bab 1 sampai bab 14, sehingga kegagalan
  toolchain ketahuan di minggu pertama, bukan di minggu kesepuluh.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Bab 7: state management
  provider: ^6.1.2
  shared_preferences: ^2.5.0

  # Bab 8: penyimpanan lokal
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Bab 9: REST API dan penyimpanan aman
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2

  # Bab 10: offline-first
  connectivity_plus: ^6.1.0

  # Bab 12: fitur perangkat
  image_picker: ^1.1.2
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Bab 11: store dalam memori untuk menguji shared_preferences
  shared_preferences_platform_interface: ^2.4.0
  # Bab 11: menjalankan sqflite di host (linux/macos/windows) saat unit test
  sqflite_common_ffi: ^2.3.3

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Kunci sementara, bukan pilihan desain.
#
# path_provider_foundation (implementasi iOS/macOS) menarik objective_c, dan
# versi 9.6.1 punya hook build yang merujuk Architecture.arm64e, nama yang
# belum ada di Dart 3.13.3. Akibatnya `flutter test` GAGAL DI LINUX karena
# hook itu tetap dikompilasi meski kodenya tidak pernah dipakai di sini.
#
# 9.4.1 adalah versi terakhir yang hook-nya kompilasi bersih. Hapus override
# ini begitu objective_c merilis perbaikannya; cek dengan:
#   flutter pub outdated
dependency_overrides:
  objective_c: 9.4.1
